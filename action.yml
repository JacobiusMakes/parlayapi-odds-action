name: "ParlayAPI Odds Fetch"
description: "Fetch odds for private analysis into a protected runner temporary file. Verifies caller repository privacy before API access."
author: "ParlayAPI"

branding:
  icon: "activity"
  color: "green"

inputs:
  api_key:
    description: "Your own ParlayAPI account key, supplied from repository secrets."
    required: true
  sport:
    description: "Sport key from https://parlay-api.com/v1/sports, for example baseball_mlb."
    required: true
  regions:
    description: "Comma-separated regions: us, us2, uk, eu, fr, au, ca, mx, latam, br, asia."
    default: "us"
  markets:
    description: "Comma-separated markets: h2h, spreads, totals."
    default: "h2h"
  odds_format:
    description: "american or decimal."
    default: "american"
  output:
    description: "Single filename only, inside a new private runner temporary directory."
    default: "odds.json"
  format:
    description: "json or csv. CSV contains one row per supplied outcome."
    default: "json"

outputs:
  file:
    description: "Absolute path of the protected temporary file, outside the checkout."
    value: ${{ steps.fetch.outputs.file }}
  event_count:
    description: "Number of events in the response, including zero for an empty array."
    value: ${{ steps.fetch.outputs.event_count }}

runs:
  using: "composite"
  steps:
    - id: fetch
      shell: bash
      env:
        PARLAY_API_KEY: ${{ inputs.api_key }}
        PARLAY_SPORT: ${{ inputs.sport }}
        PARLAY_REGIONS: ${{ inputs.regions }}
        PARLAY_MARKETS: ${{ inputs.markets }}
        PARLAY_ODDS_FORMAT: ${{ inputs.odds_format }}
        PARLAY_OUTPUT: ${{ inputs.output }}
        PARLAY_FORMAT: ${{ inputs.format }}
        ODDS_GITHUB_REPOSITORY: ${{ github.repository }}
        ODDS_GITHUB_TOKEN: ${{ github.token }}
        ODDS_GITHUB_SERVER_URL: ${{ github.server_url }}
        ODDS_WORKSPACE: ${{ github.workspace }}
        ODDS_RUNNER_TEMP: ${{ runner.temp }}
        ODDS_ACTION_PATH: ${{ github.action_path }}
      run: python3 -I "$ODDS_ACTION_PATH/fetch_odds.py"
